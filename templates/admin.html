<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Property Management</title>
</head>
<body>

    <h1>Property Management</h1>

    <!-- ✅ NAVIGATION -->
    <a href="/admin">Back to Messages</a> |
    <a href="/add-property">Add Property</a> |
    <a href="/logout">Logout</a>

    <br><br>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Price</th>
            <th>Location</th>
            <th>Details</th>
            <th>Image</th>
            <th>Type</th>
        </tr>

        {% for property in properties %}
        <tr>
            <td>{{ property[0] }}</td>
            <td>{{ property[1] }}</td>
            <td>{{ property[2] }}</td>
            <td>{{ property[3] }}</td>
            <td>{{ property[4] }}</td>
            <td>
                <img src="{{ url_for('static', filename='images/' + property[5]) }}" width="100">
            </td>
            <td>{{ property[6] }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
