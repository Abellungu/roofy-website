<h2>Edit Property</h2>

<form method="POST">
    <input type="text" name="title" value="{{ property[1] }}" required><br><br>
    <input type="text" name="price" value="{{ property[2] }}" required><br><br>
    <input type="text" name="location" value="{{ property[3] }}" required><br><br>

    <select name="type">
        <option value="Rent" {% if property[6] == 'Rent' %}selected{% endif %}>Rent</option>
        <option value="Sale" {% if property[6] == 'Sale' %}selected{% endif %}>Sale</option>
    </select><br><br>

    <button type="submit">Update Property</button>
</form>
